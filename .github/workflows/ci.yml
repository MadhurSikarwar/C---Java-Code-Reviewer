name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install (no TensorFlow needed - tests use trees only)
        run: |
          pip install fastapi uvicorn pycparser javalang scikit-learn xgboost lightgbm pandas numpy joblib python-multipart httpx pytest
      - name: Rule engine, parser, CLI tests
        working-directory: backend
        run: python -m pytest tests -q --ignore=tests/test_api.py --ignore=tests/test_ml.py --ignore=tests/test_trace.py
      - name: Build fast models (generated programs, trees only) and run API tests
        working-directory: backend
        run: |
          python ml/bootstrap.py --fast
          python -m pytest tests/test_api.py tests/test_trace.py -q -k "not dl and not v4_dl and not compare and not all"
